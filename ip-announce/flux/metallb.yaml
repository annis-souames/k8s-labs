# MetalLB itself, then its configuration. The split matters: the config objects need the
# CRDs and the admission webhook from the chart, so they wait for the HelmRelease to be ready.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./ip-announce/manifests/metallb
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb-config
  namespace: flux-system
spec:
  dependsOn:
    - name: metallb
  interval: 10m
  retryInterval: 1m
  path: ./ip-announce/manifests/metallb-config
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
