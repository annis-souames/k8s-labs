# Each rack's nodes peer with their own leaf (top-of-rack switch), like servers in a real DC.
# Short timers so a failed node or link is noticed in seconds, not minutes.
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: leaf1
  namespace: metallb-system
spec:
  myASN: 65101
  peerASN: 65001
  peerAddress: 10.100.101.2
  holdTime: 9s
  keepaliveTime: 3s
  nodeSelectors:
    - matchLabels:
        rack: rack1
---
apiVersion: metallb.io/v1beta2
kind: BGPPeer
metadata:
  name: leaf2
  namespace: metallb-system
spec:
  myASN: 65102
  peerASN: 65002
  peerAddress: 10.100.102.2
  holdTime: 9s
  keepaliveTime: 3s
  nodeSelectors:
    - matchLabels:
        rack: rack2
