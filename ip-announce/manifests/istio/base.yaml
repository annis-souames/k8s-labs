# Cluster-wide Istio resources (CRDs).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 30m
  chart:
    spec:
      chart: base
      version: 1.30.8
      sourceRef:
        kind: HelmRepository
        name: istio
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
