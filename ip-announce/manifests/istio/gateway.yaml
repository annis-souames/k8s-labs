# The ingress gateway: one pod, pinned to the node labelled ingress=true (worker in rack1).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: istio-ingress
spec:
  interval: 30m
  dependsOn:
    - name: istiod
      namespace: istio-system
  chart:
    spec:
      chart: gateway
      version: 1.30.8
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: istio-system
  values:
    replicaCount: 1
    autoscaling:
      enabled: false
    nodeSelector:
      ingress: "true"
    service:
      type: LoadBalancer
      # Cluster: every node announces the address and forwards to the pod, wherever it runs.
      # Local: only nodes running the pod announce it, and the client IP is preserved.
      externalTrafficPolicy: Cluster
      annotations:
        # Fixed address from the MetalLB pool, so the lab text can name it.
        metallb.io/loadBalancerIPs: 10.100.200.10
