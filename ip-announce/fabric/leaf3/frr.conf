! Leaf 3: AS 65003. Top-of-rack switch: peers with both spines upward.
frr defaults datacenter
hostname leaf3
log stdout informational
!
router bgp 65003
 bgp router-id 10.255.0.13
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.100.13.2 peer-group SPINES
 neighbor 10.100.13.2 description spine1
 neighbor 10.100.23.2 peer-group SPINES
 neighbor 10.100.23.2 description spine2
 !
 address-family ipv4 unicast
  ! Advertise the directly connected subnets (rack and fabric links).
  redistribute connected
  maximum-paths 4
 exit-address-family
!
