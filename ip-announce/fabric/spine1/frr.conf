! Spine 1: AS 65000 (both spines share it). Only forwards routes between leaves.
frr defaults datacenter
hostname spine1
log stdout informational
!
router bgp 65000
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 ! Paths via different leaves have different AS paths; allow ECMP across them.
 bgp bestpath as-path multipath-relax
 neighbor 10.100.11.3 remote-as 65001
 neighbor 10.100.11.3 description leaf1
 neighbor 10.100.12.3 remote-as 65002
 neighbor 10.100.12.3 description leaf2
 neighbor 10.100.13.3 remote-as 65003
 neighbor 10.100.13.3 description leaf3
 !
 address-family ipv4 unicast
  maximum-paths 4
 exit-address-family
!
