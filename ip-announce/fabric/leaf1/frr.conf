! Leaf 1: AS 65001. Top-of-rack switch: peers with both spines upward.
frr defaults datacenter
hostname leaf1
log stdout informational
!
router bgp 65001
 bgp router-id 10.255.0.11
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.100.11.2 peer-group SPINES
 neighbor 10.100.11.2 description spine1
 neighbor 10.100.21.2 peer-group SPINES
 neighbor 10.100.21.2 description spine2
 !
 ! Nodes in the rack (AS 65101) connect to us; we don't configure them one by one.
 neighbor NODES peer-group
 neighbor NODES remote-as 65101
 bgp listen range 10.100.101.0/24 peer-group NODES
 !
 address-family ipv4 unicast
  ! Advertise the directly connected subnets (rack and fabric links).
  redistribute connected
  neighbor NODES route-map FROM-NODES in
  maximum-paths 4
 exit-address-family
!
! Guardrail: nodes may only announce /32 addresses from the LoadBalancer pool.
ip prefix-list LB-POOL seq 10 permit 10.100.200.0/24 ge 32
!
route-map FROM-NODES permit 10
 match ip address prefix-list LB-POOL
!
