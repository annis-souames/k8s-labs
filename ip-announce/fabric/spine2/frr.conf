! Spine 2: AS 65000 (both spines share it). Only forwards routes between leaves.
frr defaults datacenter
hostname spine2
log stdout informational
!
router bgp 65000
 bgp router-id 10.255.0.2
 no bgp ebgp-requires-policy
 ! Paths via different leaves have different AS paths; allow ECMP across them.
 bgp bestpath as-path multipath-relax
 neighbor 10.100.21.3 remote-as 65001
 neighbor 10.100.21.3 description leaf1
 neighbor 10.100.22.3 remote-as 65002
 neighbor 10.100.22.3 description leaf2
 neighbor 10.100.23.3 remote-as 65003
 neighbor 10.100.23.3 description leaf3
 !
 address-family ipv4 unicast
  maximum-paths 4
 exit-address-family
!
